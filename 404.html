<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halaman tidak ditemukan · Jundi Abdullah</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    
    <!-- Theme Detection -->
    <script>
      if (
        localStorage.getItem('theme') === 'dark' ||
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              display: ['"Cormorant Garamond"', "Georgia", "serif"],
              sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
            },
            colors: {
              ink: "#0d1e16",
              moss: "#154d36",
              paper: "#fbf9f4",
              gold: "#c59b27",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body class="font-sans geom-bg text-ink dark:text-[#f1f5f3] min-h-screen flex items-center justify-center p-6 antialiased transition-colors duration-300">
    <div class="glass-panel max-w-md w-full rounded-3xl p-8 sm:p-10 text-center shadow-lg border border-ink/10 dark:border-white/10 dark:bg-[#0c241a]/90">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-gold/15 text-gold font-bold text-2xl dark:bg-gold/25">
        404
      </div>
      <h1 class="mt-6 font-display text-3xl font-bold text-ink dark:text-white">Halaman Tidak Ditemukan</h1>
      <p class="mt-3 text-sm leading-relaxed text-ink/70 dark:text-gray-300">
        Tautan yang Anda tuju mungkin sudah dipindahkan atau tidak tersedia.
      </p>
      <div class="mt-8">
        <a
          href="index.html"
          class="inline-flex items-center gap-2 rounded-full bg-ink px-6 py-3 text-xs font-semibold text-paper shadow-md transition-all duration-200 hover:bg-moss hover:shadow-lg dark:bg-gold dark:text-ink dark:hover:bg-gold-light"
        >
          <i class="fa-solid fa-arrow-left text-xs"></i>
          <span>Kembali ke Beranda</span>
        </a>
      </div>
    </div>
  </body>
</html>
